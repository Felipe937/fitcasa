# CI de validación para FitCasa (React + Vite + TypeScript).
# Solo valida y audita: no despliega, no modifica nada y no usa secretos.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos: el job solo lee el código.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Verificación de TypeScript
        run: npm run lint

      - name: Compilar aplicación React + Vite
        run: npm run build

      - name: Comprobar que dist/index.html existe y no está vacío
        run: |
          if [ ! -s "dist/index.html" ]; then
            echo "ERROR: dist/index.html no existe o está vacío."
            exit 1
          fi
          echo "OK: dist/index.html existe y tiene contenido válido."

      - name: Validar ejercicios.json (sintaxis y estructura)
        run: |
          python3 - <<'EOF'
          import json

          REQUIRED = {
              "id": str,
              "name": str,
              "description": str,
              "duration": str,
              "difficulty": str,
              "equipment": list,
              "zone": list,
          }
          DURATIONS = {"corta", "media", "larga"}
          DIFFICULTIES = {"principiante", "intermedio", "avanzado"}

          with open("public/ejercicios.json", encoding="utf-8") as fh:
              data = json.load(fh)

          assert isinstance(data, list) and data, "ejercicios.json debe ser una lista no vacía"
          for i, ex in enumerate(data):
              assert isinstance(ex, dict), f"elemento {i} no es un objeto"
              for field, kind in REQUIRED.items():
                  assert field in ex, f"elemento {i} sin campo {field!r}"
                  assert isinstance(ex[field], kind), f"elemento {i}: {field!r} no es {kind.__name__}"
              assert ex["duration"] in DURATIONS, f"elemento {i}: duration no válida"
              assert ex["difficulty"] in DIFFICULTIES, f"elemento {i}: difficulty no válida"
              assert ex["equipment"], f"elemento {i}: equipment vacío"
              assert ex["zone"], f"elemento {i}: zone vacía"
          print(f"ejercicios.json OK: {len(data)} ejercicios con estructura válida.")
          EOF

      - name: Comprobar identificadores de ejercicios duplicados
        run: |
          python3 - <<'EOF'
          import json
          from collections import Counter

          with open("public/ejercicios.json", encoding="utf-8") as fh:
              data = json.load(fh)
          counts = Counter(ex["id"] for ex in data)
          dupes = sorted(i for i, n in counts.items() if n > 1)
          if dupes:
              print(f"IDs duplicados: {', '.join(dupes)}")
              raise SystemExit(1)
          print(f"Sin IDs duplicados ({len(data)} ejercicios).")
          EOF

      - name: Validar sitemap.xml (XML y espacio de nombres)
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET

          NS = "http://www.sitemaps.org/schemas/sitemap/0.9"
          tree = ET.parse("public/sitemap.xml")
          root = tree.getroot()
          assert root.tag == f"{{{NS}}}urlset", f"espacio de nombres inesperado: {root.tag}"
          urls = root.findall(f"{{{NS}}}url")
          assert urls, "el sitemap no contiene urls"
          for u in urls:
              loc = u.find(f"{{{NS}}}loc")
              assert loc is not None and loc.text and loc.text.startswith("http"), "url sin loc válida"
          print(f"sitemap.xml OK: {len(urls)} urls con el espacio de nombres estándar.")
          EOF

      - name: Comprobar contraste WCAG 2.1 AA
        run: python3 contrast_check.py
