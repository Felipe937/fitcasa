version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    groups:
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
    ignore:
      # Mantener Vite y su plugin React dentro de sus ramas mayores/menores actuales.
      # Se permiten actualizaciones patch; los saltos mayor/menor requieren decisión manual.
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
