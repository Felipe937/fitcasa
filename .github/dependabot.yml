version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    groups:
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
